name: CI Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  nightly-e2e-ministack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - name: Configure local AWS profile for MiniStack
        run: |
          mkdir -p ~/.aws
          cat <<'EOF' > ~/.aws/credentials
          [ministack]
          aws_access_key_id = test
          aws_secret_access_key = test
          EOF
          cat <<'EOF' > ~/.aws/config
          [profile ministack]
          region = ap-northeast-1
          output = json
          EOF

      - name: Start MiniStack
        run: npm run ministack:up

      - name: Initialize MiniStack resources
        run: npm run ministack:init

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run MiniStack nightly E2E
        run: xvfb-run -a npm run test:e2e:ministack:nightly

      - name: Collect MiniStack logs
        if: always()
        run: docker compose -f docker/compose.yaml logs --no-color > ministack.log

      - name: Shutdown MiniStack
        if: always()
        run: npm run ministack:down

      - name: Upload Nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ministack-artifacts
          path: |
            playwright-report
            test-results
            ministack.log
          if-no-files-found: ignore
          retention-days: 14

  nightly-e2e-fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run fault-injection nightly E2E
        run: xvfb-run -a npm run test:e2e:fault:nightly

      - name: Upload Nightly fault artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fault-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
